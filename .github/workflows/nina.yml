name: N.I.N.A. plugin

# Builds and tests the N.I.N.A. plugin of integrations/nina, against the N.I.N.A. packages of its
# Directory.Build.props. The plugin includes the Windows executable of Asterion: in a release, the one
# which was just built, see release.yml, otherwise the one of the latest release. The plugin is
# uploaded as the artifact `nina-plugin`.
on:
  push:
    branches: [ main ]
    paths:
      - 'integrations/nina/**'
      - '.github/workflows/nina.yml'
  pull_request:
    paths:
      - 'integrations/nina/**'
      - '.github/workflows/nina.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'The version which is released: its native executables are artifacts of the calling workflow'
        type: string
        required: true

jobs:
  plugin:
    name: Plugin
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: integrations/nina
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: integrations/nina/global.json
      - name: Download the executable of the release
        if: inputs.version != ''
        uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          path: ${{ runner.temp }}/asterion
      - name: Download the executable of the latest release
        if: inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-windows-x86_64.zip' --dir "$RUNNER_TEMP/asterion"
      - name: Unzip the executable
        run: |
          cd "$RUNNER_TEMP/asterion"
          unzip -q ./*-windows-x86_64.zip
          distribution=$(dirname "$(find "$PWD" -name asterion.exe | head -1)")
          echo "ASTERION_DISTRIBUTION=$(cygpath -w "$distribution")" >> "$GITHUB_ENV"
          echo "ASTERION_EXECUTABLE=$(cygpath -w "$distribution/asterion.exe")" >> "$GITHUB_ENV"
      - name: Test
        run: |
          dotnet test tests/Asterion.Nina.Core.Tests -c Release
          # the results of solutions, compared with the ones of N.I.N.A.'s ASTAP solver: on Windows only
          dotnet test tests/Asterion.Nina.Tests -c Release
      - name: Build the plugin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # the plugin of a development build has the version of the next release
          version=${VERSION:-$(grep '^version=' ../../gradle.properties | cut -d= -f2)}
          dotnet build src/Asterion.Nina -c Release "-p:Version=${version%%-SNAPSHOT}" "-p:AsterionDistribution=$ASTERION_DISTRIBUTION"
      - uses: actions/upload-artifact@v4
        with:
          name: nina-plugin
          path: integrations/nina/src/Asterion.Nina/bin/Release/asterion-nina-*.zip
          if-no-files-found: error
