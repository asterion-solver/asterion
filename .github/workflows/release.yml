name: Release

# Releases a version: the native executables are built on each platform with that version, and the
# N.I.N.A. plugin with the Windows one, then JReleaser tags the current commit, and publishes a GitHub
# release with the archives, the plugin, their checksums and a changelog, and the wheels of the Python
# package are published to PyPI. Finally, the version of gradle.properties becomes the next development
# version, which is committed and pushed: in a job of its own, so that a release can be published to PyPI
# again by re-running its failed jobs. The plugin is proposed to N.I.N.A. by hand, for the releases which
# matter to it: see nina-manifest.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, for example 1.0.0'
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION', expected something like 1.0.0 or 1.0.0-rc.1"
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Snapshot versions can't be released"
            exit 1
          fi
          # the versions of the Python package: 1.0.0-rc.1 is 1.0.0rc1
          if [[ "$VERSION" == *-* && ! "$VERSION" =~ -(alpha|beta|rc)\.?(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Pre-releases are alpha, beta or rc, such as 1.0.0-rc.1, which the Python package can express"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ inputs.version }}

  nina:
    needs: build
    uses: ./.github/workflows/nina.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Release
    needs: [ build, nina ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # the whole history, for the changelog
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm'
          # the release of the native executables, see native.yml
          version: '25.4'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: nina-plugin
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: library-*
          path: artifacts
          merge-multiple: true
      # the native library is released as a single archive, with a directory per platform: the release
      # page lists one archive for developers, next to the ones of the executables
      - name: Package the native library
        run: ./gradlew :asterion-lib:nativeLibraryBundle -Pversion=${{ inputs.version }}
      - name: Release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jreleaserFullRelease -Pversion=${{ inputs.version }}
      - name: JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties

  # The wheels of the Python package, published to PyPI with trusted publishing: PyPI trusts this workflow, with
  # the pypi environment, to publish asterion-solver, without any secret
  pypi:
    name: PyPI
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/asterion-solver/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  next-version:
    name: Next development version
    needs: [ release, pypi ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare the next development version
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          current=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [[ "$VERSION" == *-* ]]; then
            # a pre-release, such as 1.0.0-rc.1: the final version comes next
            next="${VERSION%%-*}-SNAPSHOT"
          else
            IFS=. read -r major minor patch <<< "$VERSION"
            next="$major.$minor.$((patch + 1))-SNAPSHOT"
          fi
          # a higher version which was set by hand for the next release, such as 0.2.0-SNAPSHOT, is kept
          if [ "$(printf '%s\n' "$VERSION" "${current%-SNAPSHOT}" | sort -V | tail -1)" != "$VERSION" ]; then
            next=$current
          fi
          if [ "$next" = "$current" ]; then
            echo "The development version stays $current"
            exit 0
          fi
          sed -i "s/^version=.*/version=$next/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a release thing: [skip ci], and pushes made with GITHUB_TOKEN never start workflows anyway
          git commit -am "chore(release): prepare $next [skip ci]"
          # commits may have been pushed while the release was built
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
